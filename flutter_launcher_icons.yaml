# 앱 아이콘 생성 설정 (dart run flutter_launcher_icons 로 다시 만든다)
flutter_launcher_icons:
  # Android 아이콘을 만든다.
  android: true
  # iOS 아이콘을 만든다.
  ios: true
  # 원본 아이콘(1024x1024, 투명도 없음)
  image_path: "assets/icon/app_icon.png"
  # iOS 아이콘에서 투명 채널을 제거한다(App Store 요구 사항).
  remove_alpha_ios: true
  # Android 적응형 아이콘 배경색(금빛)
  adaptive_icon_background: "#D9A441"
  # Android 적응형 아이콘 전경(안전 영역 안에 줄인 그림)
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Android 최소 SDK(적응형 아이콘은 26 이상에서 사용)
  min_sdk_android: 21
